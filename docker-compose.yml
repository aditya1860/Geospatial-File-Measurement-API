version: '3.8'

services:
  geospatial-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geospatial_measurement_api
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    environment:
      - PROJECT_NAME=Geospatial File Measurement API
      - PROJECT_VERSION=1.0.0
      - API_V1_STR=/api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
